<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PresupuestoRD Pro — Sistema Integral de Presupuestación</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14;--s1:#13161e;--s2:#191d28;--s3:#1f2433;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);--bd3:rgba(255,255,255,.18);
  --acc:#e8a020;--acc2:#f0b84a;--acc3:rgba(232,160,32,.12);
  --teal:#22d3c8;--blue:#5b9cf6;--green:#3dd68c;--red:#f06060;--purple:#9b7de8;
  --txt:#dde2ef;--mut:#556278;--mut2:#8a96aa;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
  --r:8px;--rs:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.6;min-height:100vh;overflow:hidden}

/* ─ LAYOUT ─────────────────────────────────────────── */
.app{display:flex;height:100vh}
.sidebar{width:240px;min-width:240px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sidebar-inner{flex:1;overflow-y:auto;padding-bottom:16px}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ─ SIDEBAR ─────────────────────────────────────────── */
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.logo-title{font-family:var(--fh);font-size:13.5px;font-weight:800;color:var(--acc);letter-spacing:-.2px;line-height:1}
.logo-sub{font-size:9.5px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}

/* Accordion sections */
.acc-section{border-bottom:1px solid var(--bd)}
.acc-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;user-select:none;transition:background .12s}
.acc-header:hover{background:rgba(255,255,255,.03)}
.acc-header.open{background:rgba(232,160,32,.05)}
.acc-letter{font-family:var(--fm);font-size:10px;color:var(--acc);font-weight:600;width:18px;flex-shrink:0}
.acc-label{flex:1;font-size:12px;font-weight:600;color:var(--txt);letter-spacing:.1px;padding:0 6px}
.acc-total{font-family:var(--fm);font-size:10.5px;color:var(--acc);opacity:.8}
.acc-chevron{font-size:9px;color:var(--mut);transition:transform .2s;flex-shrink:0}
.acc-header.open .acc-chevron{transform:rotate(90deg)}
.acc-body{display:none;background:rgba(0,0,0,.15)}
.acc-header.open + .acc-body{display:block}

/* Nav items inside accordion */
.ni{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 38px;cursor:pointer;font-size:12px;color:var(--mut2);transition:all .12s;border-left:2px solid transparent;user-select:none;position:relative}
.ni:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.ni.active{color:var(--acc);border-left-color:var(--acc);background:rgba(232,160,32,.06);font-weight:500}
.ni-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0}
.ni.active .ni-dot{opacity:1}
.ni-total{font-family:var(--fm);font-size:10px;color:var(--green);margin-left:auto;opacity:.8}

/* Root nav items (not in accordion) */
.ni-root{display:flex;align-items:center;gap:7px;padding:8px 14px;cursor:pointer;font-size:12px;color:var(--mut2);transition:all .12s;border-left:2px solid transparent;user-select:none}
.ni-root:hover{color:var(--txt);background:rgba(255,255,255,.03)}
.ni-root.active{color:var(--acc);border-left-color:var(--acc);background:rgba(232,160,32,.06);font-weight:500}
.sec-label{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);padding:10px 14px 4px}

/* ─ TOPBAR ─────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:10;background:rgba(13,15,20,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-title{font-family:var(--fh);font-weight:700;font-size:14.5px}
.tb-right{display:flex;gap:7px;align-items:center}
.badge-date{font-size:9.5px;font-family:var(--fm);color:var(--mut2);background:var(--s2);border:1px solid var(--bd);border-radius:4px;padding:2px 7px}
.badge-ver{font-size:9.5px;background:rgba(232,160,32,.12);color:var(--acc);border:1px solid rgba(232,160,32,.25);border-radius:4px;padding:2px 7px;font-weight:600}

.content{padding:22px 24px;flex:1}

/* ─ PAGES ─────────────────────────────────────────── */
.page{display:none}.page.active{display:block}

/* ─ CARDS ─────────────────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ct{font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bdg{font-family:var(--fm);font-size:9.5px;font-weight:400;padding:2px 6px;border-radius:3px;background:var(--s2);color:var(--mut2)}

/* ─ GRID ─────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}

/* ─ FORM ─────────────────────────────────────────── */
.field{margin-bottom:9px}
.field label{display:block;font-size:10.5px;font-weight:500;color:var(--mut2);margin-bottom:3px;letter-spacing:.2px}
.field input,.field select,.field textarea{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--rs);color:var(--txt);font-family:var(--fb);font-size:12.5px;padding:6px 9px;transition:border-color .15s;outline:none}
.field input:focus,.field select:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(232,160,32,.1)}
.field select{cursor:pointer}
.field input[type=number]{font-family:var(--fm)}

/* ─ BUTTONS ─────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--rs);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .14s;white-space:nowrap}
.btn-p{background:var(--acc);color:#0d0f14}.btn-p:hover{background:var(--acc2)}
.btn-s{background:var(--s2);color:var(--mut2);border:1px solid var(--bd2)}.btn-s:hover{color:var(--txt);border-color:var(--bd3)}
.btn-t{background:rgba(34,211,200,.1);color:var(--teal);border:1px solid rgba(34,211,200,.2)}.btn-t:hover{background:rgba(34,211,200,.18)}
.btn-r{background:rgba(240,96,96,.1);color:var(--red);border:1px solid rgba(240,96,96,.2)}.btn-r:hover{background:rgba(240,96,96,.18)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-lg{padding:9px 18px;font-size:13px}

/* ─ KPI BOXES ─────────────────────────────────────────── */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.kpi-l{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.kpi-v{font-family:var(--fh);font-size:20px;font-weight:800;line-height:1}
.kpi-s{font-size:10.5px;color:var(--mut2);margin-top:3px}
.kpi.acc .kpi-v{color:var(--acc)}.kpi.teal .kpi-v{color:var(--teal)}
.kpi.grn .kpi-v{color:var(--green)}.kpi.blu .kpi-v{color:var(--blue)}

/* ─ TABLE ─────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--bd2)}
th{text-align:left;padding:6px 8px;font-size:9.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--bd);font-size:12px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.td-r{text-align:right;font-family:var(--fm)}
.td-p{text-align:right;font-family:var(--fm);color:var(--acc)}
.td-g{text-align:right;font-family:var(--fm);color:var(--green);font-weight:500}

/* ─ ELEMENT CARD ─────────────────────────────────────────── */
.el-card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--rs);padding:12px;margin-bottom:8px}
.el-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.el-num{font-family:var(--fm);font-size:10.5px;color:var(--acc);font-weight:600}
.el-tot{font-family:var(--fm);font-size:12.5px;color:var(--green);font-weight:500}

/* ─ TOTAL ROW ─────────────────────────────────────────── */
.trow{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:rgba(232,160,32,.06);border:1px solid rgba(232,160,32,.16);border-radius:var(--rs);margin-top:9px}
.trow-l{font-weight:600;font-size:12.5px}
.trow-v{font-family:var(--fh);font-size:18px;font-weight:800;color:var(--acc)}

/* ─ ALERT ─────────────────────────────────────────── */
.alert{padding:8px 12px;border-radius:var(--rs);font-size:11.5px;margin-bottom:10px;display:flex;align-items:flex-start;gap:6px}
.al-i{background:rgba(91,156,246,.08);border:1px solid rgba(91,156,246,.18);color:var(--blue)}
.al-w{background:rgba(232,160,32,.08);border:1px solid rgba(232,160,32,.18);color:var(--acc)}
.al-g{background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.18);color:var(--green)}

/* ─ SECTION HEADER ─────────────────────────────────────────── */
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
.st{font-family:var(--fh);font-size:16px;font-weight:800;letter-spacing:-.2px}
.ss{font-size:11.5px;color:var(--mut2);margin-top:2px}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex-shrink:0}

/* ─ UPLOAD ZONE ─────────────────────────────────────────── */
.upz{border:2px dashed var(--bd2);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;transition:all .18s;background:rgba(255,255,255,.01);margin-bottom:11px}
.upz:hover,.upz.drag{border-color:var(--acc);background:rgba(232,160,32,.04)}

/* ─ PILL ─────────────────────────────────────────── */
.pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.pg{background:rgba(61,214,140,.1);color:var(--green)}
.pa{background:rgba(232,160,32,.1);color:var(--acc)}
.pb{background:rgba(91,156,246,.1);color:var(--blue)}

/* ─ NOTIF ─────────────────────────────────────────── */
.notif{position:fixed;bottom:20px;right:20px;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 15px;font-size:12.5px;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.5);transform:translateY(10px);opacity:0;transition:all .22s;max-width:280px}
.notif.show{transform:translateY(0);opacity:1}
.notif.ok{border-left:3px solid var(--green)}
.notif.err{border-left:3px solid var(--red)}
.notif.inf{border-left:3px solid var(--blue)}

/* ─ PLATEA ─────────────────────────────────────────── */
.plat-opt{background:var(--s2);border:2px solid var(--bd);border-radius:var(--rs);padding:12px;cursor:pointer;transition:all .18s;margin-bottom:7px}
.plat-opt:hover,.plat-opt.sel{border-color:var(--acc);background:rgba(232,160,32,.05)}
.plat-code{font-family:var(--fm);font-size:10px;color:var(--acc);font-weight:600;margin-bottom:3px}
.plat-spec{background:var(--s1);border:1px solid var(--bd);border-radius:3px;padding:2px 6px;font-family:var(--fm);font-size:10px;display:inline-block;margin:2px 2px 2px 0}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* ─ INLINE LABEL ─────────────────────────────────────────── */
.manual-label{font-size:11px;color:var(--mut2);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}

/* ─ CHAPTER ROW ─────────────────────────────────────────── */
.crow{display:flex;align-items:center;padding:9px 13px;border-radius:var(--rs);background:var(--s2);border:1px solid var(--bd);margin-bottom:6px;cursor:pointer;transition:all .12s}
.crow:hover{border-color:var(--bd2);background:rgba(255,255,255,.03)}
.clet{font-family:var(--fm);font-size:10px;color:var(--acc);width:22px;flex-shrink:0}
.cname{flex:1;font-size:12.5px;font-weight:500}
.cbar-w{width:80px;height:3px;background:var(--bd2);border-radius:2px;margin:0 10px;overflow:hidden}
.cbar{height:100%;border-radius:2px}
.cpct{font-family:var(--fm);font-size:10px;color:var(--mut2);width:32px;text-align:right}
.ctot{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--acc);width:105px;text-align:right}

/* ─ SECTION DIVIDER ─────────────────────────────────────────── */
.sdiv{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);padding:4px 0 2px;margin-top:4px;opacity:.6}

@media print{.sidebar,.topbar{display:none}.main{overflow:visible}.app{display:block;height:auto}body{background:white;color:black;overflow:visible}}
</style>
</head>

function buildSidebar(){
  const niv=ST.project.niveles||2;
  let html='';

  // Root items
  html+=`<div class="sec-label">General</div>`;
  html+=niRoot('dashboard','Dashboard');
  html+=niRoot('proyecto','Datos del Proyecto');

  // BNP section
  html+=`<div class="acc-section">`;
  html+=`<div class="acc-header open" onclick="accToggle(this)">
    <span class="acc-letter">A</span>
    <span class="acc-label">Prelim. y Bajo Nivel de Piso</span>
    <span class="acc-total" id="tot-bnp"></span>
    <span class="acc-chevron">›</span>
  </div><div class="acc-body">`;
  BNP_SECTIONS.forEach(s=>{
    html+=niLevel(s.id,s.label);
  });
  html+=`</div></div>`;

  // Level sections
  const letters='BCDEFGHIJ';
  for(let n=1;n<=niv;n++){
    const letter=letters[n-1]||n;
    html+=`<div class="acc-section">`;
    html+=`<div class="acc-header" onclick="accToggle(this)">
      <span class="acc-letter">${letter}</span>
      <span class="acc-label">Nivel ${n}</span>
      <span class="acc-total" id="tot-n${n}"></span>
      <span class="acc-chevron">›</span>
    </div><div class="acc-body">`;
    levelSections(n).forEach(s=>{
      html+=niLevel(s.id,s.label);
    });
    html+=`</div></div>`;
  }

  // Exteriores
  const extLetter=letters[niv]||'D';
  html+=`<div class="acc-section">`;
  html+=`<div class="acc-header" onclick="accToggle(this)">
    <span class="acc-letter">${extLetter}</span>
    <span class="acc-label">Exteriores y Techo</span>
    <span class="acc-total" id="tot-ext"></span>
    <span class="acc-chevron">›</span>
  </div><div class="acc-body">`;
  EXT_SECTIONS.forEach(s=>{
    html+=niLevel(s.id,s.label);
  });
  html+=`</div></div>`;

  // Sistema
  html+=`<div class="sec-label">Sistema</div>`;
  html+=niRoot('cuantificacion','🤖 Cuantificación IA');
  html+=niRoot('apu','⚙ Crear / Gestionar APU');
  html+=niRoot('resumen','Presupuesto Final');
  html+=niRoot('actualizar','Actualizar Precios');

  $('sidebar-inner').innerHTML=html;

  // Attach click events
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>nav(el.dataset.page));
  });
}

function niRoot(page,label){
  return `<div class="ni-root" data-page="${page}"><div class="ni-dot"></div>${label}</div>`;
}
function niLevel(page,label){
  const tot=sectionTotal(page);
  return `<div class="ni" data-page="${page}"><div class="ni-dot"></div>${label}${tot>0?`<span class="ni-total">${fmt(tot)}</span>`:''}</div>`;
}

function sectionTotal(secId){
  return (ST.sections[secId]||[]).reduce((s,i)=>s+i.total,0);
}

function updateSidebarTotals(){
  const niv=ST.project.niveles||2;
  // BNP
  let bnp=0;BNP_SECTIONS.forEach(s=>bnp+=sectionTotal(s.id));
  const tBnp=$('tot-bnp');if(tBnp)tBnp.textContent=bnp>0?fmt(bnp):'';
  // Levels
  for(let n=1;n<=niv;n++){
    let lt=0;levelSections(n).forEach(s=>lt+=sectionTotal(s.id));
    const el=$(`tot-n${n}`);if(el)el.textContent=lt>0?fmt(lt):'';
  }
  // Ext
  let ext=0;EXT_SECTIONS.forEach(s=>ext+=sectionTotal(s.id));
  const tExt=$('tot-ext');if(tExt)tExt.textContent=ext>0?fmt(ext):'';
}

// ═══════════════════════════════════════════════════════════════
// ITEM ENGINE (add/remove/update partidas)
// ═══════════════════════════════════════════════════════════════
function addItem(secId,sg,und){
  if(!ST.sections[secId]) ST.sections[secId]=[];
  const id=uid();
  ST.sections[secId].push({id,sg,acuCod:'',desc:'',qty:0,und,pu:0,total:0,isManual:false,manualDesc:'',manualPU:0});
  if(_activePage===secId) renderPage(secId);
  updateSidebarTotals();
}

function removeItem(secId,id){
  ST.sections[secId]=(ST.sections[secId]||[]).filter(i=>i.id!==id);
  renderPage(secId);
  updateSidebarTotals();
}

function updateItem(secId,id,field,value){
  const item=(ST.sections[secId]||[]).find(i=>i.id===id);
  if(!item)return;
  item[field]=value;
  if(field==='acuCod'&&!item.isManual){
    const all=[...ACU_DB,...ACU_MOV_TIERRA,...ACU_IMPERMEAB,...ACU_COCINA,...ACU_VENTANAS,...ACU_BARANDAS];
    const acu=all.find(r=>r.cod===value);
    if(acu){item.pu=acu.total;item.und=acu.und;item.desc=acu.desc;
      // Auto-fill pdfName only if not yet customized
      if(!item.pdfName) item.pdfName=acu.desc;
    }
  }
  if(field==='isManual'){
    item.isManual=value;
    if(!value){
      const all=[...ACU_DB,...ACU_MOV_TIERRA,...ACU_IMPERMEAB,...ACU_COCINA,...ACU_VENTANAS,...ACU_BARANDAS];
      const acu=all.find(r=>r.cod===item.acuCod);
      if(acu){item.pu=acu.total;item.desc=acu.desc;}
    }
    renderPage(secId);return;
  }
  if(field==='manualDesc'){item.desc=value;if(!item.pdfName)item.pdfName=value;}
  if(field==='manualPU') item.pu=parseFloat(value)||0;
  if(field==='pdfName'){
    // Empty string = revert to auto
    item.pdfName=value.trim()||'';
    renderPage(secId);return;
  }
  item.total=(item.qty>0&&item.pu>0)?item.qty*item.pu:0;
  const totEl=$('itot-'+id);if(totEl)totEl.textContent=item.total>0?fmt(item.total):'—';
  updateSidebarTotals();
  if(ST.calcDone)recalcTotals();
}

// ═══════════════════════════════════════════════════════════════
// PAGE RENDERER
// ═══════════════════════════════════════════════════════════════
function renderPage(pageId){
  const mc=$('main-content');
  if(pageId==='dashboard'){renderDashboard();return;}
  if(pageId==='proyecto'){renderProyecto();return;}
  if(pageId==='resumen'){renderResumen();return;}
  if(pageId==='actualizar'){renderActualizar();return;}
  if(pageId==='cuantificacion'){renderCuantificacion();return;}
  if(pageId==='platea'){renderPlatPage();return;}
  if(pageId==='apu'){renderAPU();return;}

  // Find section definition
  const allSecs=[...BNP_SECTIONS,...EXT_SECTIONS];
  for(let n=1;n<=(ST.project.niveles||2);n++) levelSections(n).forEach(s=>allSecs.push(s));
  const secDef=allSecs.find(s=>s.id===pageId);
  if(!secDef){mc.innerHTML=`<div class="alert al-w">Página no encontrada: ${pageId}</div>`;return;}

  renderSection(secDef);
}

function renderSection(secDef){
  const mc=$('main-content');
  const items=(ST.sections[secDef.id]||[]);
  const total=items.reduce((s,i)=>s+i.total,0);

  let btnHtml=secDef.btns.map(b=>`<button class="btn btn-sm ${b.primary?'btn-p':'btn-s'}" onclick="addItem('${secDef.id}','${b.sg}','${b.und}')">${b.label}</button>`).join('');
  btnHtml+=`<button class="btn btn-t btn-sm" onclick="addItem('${secDef.id}','','UND');enableManual('${secDef.id}')">✏ Manual</button>`;

  let itemsHtml=items.length===0
    ?`<div class="alert al-i">ℹ Usa los botones de arriba para agregar partidas a esta sección.</div>`
    :items.map((item,idx)=>renderItem(secDef.id,item,idx)).join('');

  mc.innerHTML=`
  <div class="sh">
    <div><div class="st">${secDef.label}</div><div class="ss">${secDef.id}</div></div>
    <div class="btn-row">${btnHtml}</div>
  </div>
  <div id="sec-items-${secDef.id}">${itemsHtml}</div>
  ${total>0?`<div class="trow"><span class="trow-l">Subtotal — ${secDef.label}</span><span class="trow-v">${fmt(total)}</span></div>`:''}`;
}

function enableManual(secId){
  const items=ST.sections[secId]||[];
  const last=items[items.length-1];

function selectPlat(id){
  ST.platea.cfg=PLATEA_CFGS.find(c=>c.id===id);
  document.querySelectorAll('.plat-opt').forEach(el=>el.classList.remove('sel'));
  event.currentTarget.classList.add('sel');
  calcPlatea();
}

function calcPlatea(){
  const cfg=ST.platea.cfg;if(!cfg)return;
  const area=parseFloat($('plat-area')?.value)||120;
  const perim=parseFloat($('plat-per')?.value)||50;
  if(!area)return;

  function acero(v,sep,ar){
    const pw=PW[v]||0.560;
    const ml=(1/sep)*2*ar*1.10;
    return {ml,kg:ml*pw,qq:(ml*pw)/100};
  }
  const acInf=acero(cfg.acInf.v,cfg.acInf.sep,area);
  const acSup=acero(cfg.acSup.v,cfg.acSup.sep,area);
  const vol=area*cfg.esp;
  const puH=ACU_IND[cfg.fc]||14500;
  const cH=vol*puH;
  const PU_AC=2760.13,PU_AL=76.27;
  const cI=acInf.qq*PU_AC,cS=acSup.qq*PU_AC;
  const al_lb=(acInf.qq+acSup.qq)*1.2*2.205;
  const cAl=al_lb*PU_AL;
  const aEnc=perim*cfg.esp;
  const cEnc=aEnc*889.54;
  const total=cH+cI+cS+cAl+cEnc;

  ST.platea.total=total;
  if(ST.calcDone)recalcTotals();

  const res=$('plat-result');if(!res)return;
  res.innerHTML=`<div class="card" style="margin-top:12px">
    <div class="ct">Desglose — ${cfg.id} · ${area} m² · e=${cfg.esp*100} cm</div>
    <table><thead><tr><th>Partida</th><th>Cant.</th><th>Und</th><th>P.U. (RD$)</th><th>Total (RD$)</th></tr></thead>
    <tbody>
      <tr><td>Hormigón industrial ${cfg.fc} kg/cm²</td><td class="td-r">${fmtN(vol)}</td><td>m³</td><td class="td-p">${fmt(puH)}</td><td class="td-g">${fmt(cH)}</td></tr>
      <tr><td>Acero inf. ${cfg.acInf.v}@${cfg.acInf.sep*100}cm A.D.+A.C.</td><td class="td-r">${fmtN(acInf.qq)}</td><td>QQ</td><td class="td-p">${fmt(PU_AC)}</td><td class="td-g">${fmt(cI)}</td></tr>
      <tr><td>Acero sup. ${cfg.acSup.v}@${cfg.acSup.sep*100}cm A.D.+A.C.</td><td class="td-r">${fmtN(acSup.qq)}</td><td>QQ</td><td class="td-p">${fmt(PU_AC)}</td><td class="td-g">${fmt(cS)}</td></tr>
      <tr><td>Alambre galvanizado cal. 18</td><td class="td-r">${fmtN(al_lb)}</td><td>LB</td><td class="td-p">${fmt(PU_AL)}</td><td class="td-g">${fmt(cAl)}</td></tr>
      <tr><td>Encofrado perimetral madera</td><td class="td-r">${fmtN(aEnc)}</td><td>m²</td><td class="td-p">${fmt(889.54)}</td><td class="td-g">${fmt(cEnc)}</td></tr>
    </tbody></table>
    <div class="trow"><span class="trow-l">Total Platea — ${cfg.id}</span><span class="trow-v">${fmt(total)}</span></div>
    <div style="font-size:10.5px;color:var(--mut2);margin-top:5px">
      Acero total: ${fmtN((acInf.kg+acSup.kg))} kg · Vol. hormigón: ${fmtN(vol)} m³ · Ref: ACI 318-19 / MOPC RD
    </div>
  </div>`;
}

// TOTALS
// ═══════════════════════════════════════════════════════════════
function recalcTotals(){
  const p=ST.project;
  let costo_dir=0;
  // Sum all sections
  Object.values(ST.sections).forEach(arr=>arr.forEach(i=>costo_dir+=i.total));
  // Add platea if applicable
  if(p.fund==='platea') costo_dir+=ST.platea.total||0;

  const adm=costo_dir*(p.adm/100);
  const seg=costo_dir*(p.seg/100);
  const cod=costo_dir*(p.cod/100);
  const pen=costo_dir*(p.pen/100);
  const hon=costo_dir*0.08;
  const itb=hon*(p.itb/100);
  const ind=adm+seg+cod+pen+itb;
  ST.totals={costo_dir,adm,seg,cod,pen,hon,itb,ind,total:costo_dir+ind};
  ST.calcDone=true;
  updateSidebarTotals();
}

function renderResumen(){
  const mc=$('main-content');
  const t=ST.totals,p=ST.project;
  if(!ST.calcDone||!t.total){
    mc.innerHTML=`<div class="alert al-w">⚠ Agrega partidas en las secciones del menú para generar el presupuesto.</div>`;
    return;
  }
  const niv=p.niveles||2;
  const allGroups=[];
  const letters='ABCDEFGHIJ';
  let bnpT=0;BNP_SECTIONS.forEach(s=>bnpT+=sectionTotal(s.id));
  allGroups.push({letra:'A',label:'PRELIM. Y BAJO NIVEL DE PISO',total:bnpT,secs:BNP_SECTIONS});
  for(let n=1;n<=niv;n++){
    const lvSecs=levelSections(n);
    let lt=0;lvSecs.forEach(s=>lt+=sectionTotal(s.id));
    allGroups.push({letra:letters[n],label:`NIVEL ${n}`,total:lt,secs:lvSecs});
  }
  let extT=0;EXT_SECTIONS.forEach(s=>extT+=sectionTotal(s.id));
  allGroups.push({letra:letters[niv+1]||'D',label:'EXTERIORES Y TECHO',total:extT,secs:EXT_SECTIONS});

  let rows='';
  allGroups.forEach(g=>{
    rows+=`<tr style="background:var(--s2)"><td colspan="5" style="font-weight:700;color:var(--acc);font-size:11px;padding:8px">${g.letra}.- ${g.label}</td></tr>`;
    let gNum=1;
    g.secs.forEach(s=>{
      const items=ST.sections[s.id]||[];
      if(!items.length)return;
      items.forEach((item,i)=>{
        const desc=item.pdfName||item.desc||item.manualDesc||'Partida';
        rows+=`<tr><td class="td-r" style="color:var(--mut)">${g.letra}.${String(gNum).padStart(2,'0')}</td><td>${desc}</td><td class="td-r">${fmtN(item.qty)}</td><td>${item.und}</td><td class="td-p">${fmt(item.pu)}</td><td class="td-g">${fmt(item.total)}</td></tr>`;
        gNum++;

function dropF(e){e.preventDefault();e.currentTarget.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)processFile(f);}
function handleF(e){const f=e.target.files[0];if(f)processFile(f);}
function processFile(file){
  const r=new FileReader();
  r.onload=e=>{
    let upd=0;
    e.target.result.split('\n').forEach(line=>{
      const cols=line.split(/[\t,]/);
      const cod=cols[0]?.trim();
      const tot=parseFloat(cols[cols.length-1]?.replace(/[^0-9.]/g,''));
      if(cod&&!isNaN(tot)&&tot>0){
        const idx=ACU_DB.findIndex(r=>r.cod===cod);
        if(idx>=0){ACU_DB[idx].total=tot;upd++;}
      }
    });
    if(upd>0){notify(`✓ ${upd} precios actualizados desde ${file.name}`,'ok');recalcTotals();}
    else notify('No se encontraron códigos coincidentes.','err');
  };
  r.readAsText(file,'UTF-8');
}
function procPaste(){
  const text=$('paste-area').value;if(!text.trim())return;
  let upd=0;
  text.split('\n').forEach(line=>{
    const cols=line.split('\t');
    const cod=cols[0]?.trim();
    const tot=parseFloat(cols[1]?.replace(/[^0-9.]/g,''));
    if(cod&&!isNaN(tot)&&tot>0){
      const idx=ACU_DB.findIndex(r=>r.cod===cod);
      if(idx>=0){ACU_DB[idx].total=tot;upd++;}
    }
  });
  if(upd>0){$('paste-area').value='';notify(`✓ ${upd} precios actualizados`,'ok');recalcTotals();}
  else notify('No se reconocieron códigos en el texto.','err');
}

function exportCSV(){
  if(!ST.calcDone)return notify('Agrega partidas primero.','err');
  const p=ST.project,t=ST.totals;
  const BOM='\uFEFF';
  let csv=BOM;
  csv+=`PRESUPUESTO GENERAL POR PARTIDAS\n`;
  csv+=`Proyecto:,${p.nombre}\nEmpresa:,${p.empresa}\nIngeniero:,${p.ingeniero}\nUbicación:,${p.ubicacion}\nÁrea:,${p.area} m²\nFecha:,${new Date().toLocaleDateString('es-DO')}\n\n`;
  csv+=`N°,DESCRIPCIÓN,CANTIDAD,UNIDAD,P.U. (RD$),SUBTOTAL (RD$)\n`;

  const niv=p.niveles||2;
  const letters='ABCDEFGHIJ';
  const allGroups=[
    {letra:'A',label:'PRELIM. Y BNP',secs:BNP_SECTIONS},
    ...Array.from({length:niv},(_,i)=>({letra:letters[i+1],label:`NIVEL N${i+1}`,secs:levelSections(i+1)})),
    {letra:letters[niv+1]||'D',label:'EXTERIORES Y TECHO',secs:EXT_SECTIONS},
  ];

  allGroups.forEach(g=>{
    csv+=`\n${g.letra}.- ${g.label}\n`;
    let gNum=1;
    g.secs.forEach(s=>{
      const items=ST.sections[s.id]||[];
      if(!items.length)return;
      items.forEach(item=>{
        const desc=(item.pdfName||item.desc||item.manualDesc||'').replace(/,/g,';');
        csv+=`${g.letra}.${String(gNum).padStart(2,'0')},${desc},${fmtN(item.qty)},${item.und},${item.pu.toFixed(2)},${item.total.toFixed(2)}\n`;
        gNum++;
      });
    });
    const tot=g.secs.reduce((s,sec)=>s+sectionTotal(sec.id),0);
    csv+=`,,,,SUB-TOTAL ${g.label},${tot.toFixed(2)}\n`;
  });

  csv+=`\nTOTAL COSTOS DIRECTOS,,,,,${t.costo_dir.toFixed(2)}\n\n`;
  csv+=`II.- COSTOS INDIRECTOS\n`;
  csv+=`Gastos Adm. y Dir. Técnica (${p.adm}%),,,,, ${t.adm.toFixed(2)}\n`;
  csv+=`Seguros y Leyes Sociales (${p.seg}%),,,,, ${t.seg.toFixed(2)}\n`;
  csv+=`CODIA (${p.cod}%),,,,, ${t.cod.toFixed(2)}\n`;
  csv+=`Fondo Pensiones (${p.pen}%),,,,, ${t.pen.toFixed(2)}\n`;
  csv+=`ITBIS sobre honorarios (${p.itb}%),,,,, ${t.itb.toFixed(2)}\n`;
  csv+=`TOTAL COSTOS INDIRECTOS,,,,,${t.ind.toFixed(2)}\n\n`;
  csv+=`TOTAL GENERAL,,,,,${t.total.toFixed(2)}\n`;
  csv+=`Costo por m²,,,,,${(t.total/(p.area||1)).toFixed(2)}\n`;

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Presupuesto_${(p.nombre||'proyecto').replace(/\s/g,'_')}.csv`;
  a.click();
  notify('✓ Archivo Excel exportado','ok');
}

// Convierte File a base64 usando FileReader.readAsDataURL (funciona con archivos de cualquier tamaño)
function fileToBase64(file, maxMB=null){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      // readAsDataURL produce: "data:application/pdf;base64,XXXXXX"
      // Extraemos solo la parte base64
      const dataUrl=e.target.result;
      const base64=dataUrl.split(',')[1];
      if(!base64){reject(new Error('No se pudo leer el archivo'));return;}

      // Si hay límite de tamaño, truncamos el base64 (aprox maxMB*1.33 chars en b64)
      if(maxMB){
        const maxChars=maxMB*1024*1024*1.37; // factor b64 overhead
        if(base64.length>maxChars){
          // Truncar a un múltiplo de 4 para base64 válido
          const truncated=base64.slice(0,Math.floor(maxChars/4)*4);
          resolve(truncated);
          return;
        }
      }
      resolve(base64);
    };
    reader.onerror=()=>reject(new Error('Error al leer el archivo: '+reader.error));
    reader.readAsDataURL(file);
  });
}

async function processPlanoFile(file){
  const statusEl=$('planos-status');
  const dzEl=$('dz-planos');
  if(statusEl) statusEl.textContent=`⏳ Cargando ${file.name}...`;
  if(dzEl) dzEl.style.borderColor='var(--acc)';

  try{
    // Planos: máximo 20MB (la API acepta hasta ~20MB en base64)
    const maxMB=20;
    if(file.size>maxMB*1024*1024){
      notify(`Archivo muy grande (${(file.size/1024/1024).toFixed(1)}MB). Máximo recomendado: ${maxMB}MB`,'err');
      if(statusEl) statusEl.textContent=`❌ Archivo demasiado grande`;
      return;
    }
    const b64=await fileToBase64(file);
    QAI.planosB64=b64;
    QAI.planosName=file.name;
    const sizeMB=(file.size/1024/1024).toFixed(1);
    if(statusEl) statusEl.textContent=`✅ ${file.name} — ${sizeMB} MB listo`;
    if(dzEl) dzEl.style.borderColor='var(--green)';
    notify(`✓ Planos cargados: ${file.name} (${sizeMB} MB)`,'ok');
  }catch(err){
    notify('Error cargando planos: '+err.message,'err');
    if(statusEl) statusEl.textContent=`❌ Error al cargar`;
    if(dzEl) dzEl.style.borderColor='var(--red)';
  }
}

async function processMemoFile(file){
  const statusEl=$('memoria-status');
  const dzEl=$('dz-memoria');
  if(statusEl) statusEl.textContent=`⏳ Cargando ${file.name}...`;
  if(dzEl) dzEl.style.borderColor='var(--acc)';

  try{
    const sizeMB=(file.size/1024/1024).toFixed(1);
    // Store full file as valid base64 — never split a PDF byte-by-byte
    const b64=await fileToBase64(file);
    QAI.memoriaB64=b64;
    QAI.memoriaChunks=null; // clear any old chunks
    QAI.memoriaName=file.name;

    if(statusEl) statusEl.textContent=`✅ ${file.name} — ${sizeMB} MB listo`;
    if(dzEl) dzEl.style.borderColor='var(--green)';
    notify(`✓ Memoria cargada: ${file.name} (${sizeMB} MB)`,'ok');
  }catch(err){
    notify('Error cargando memoria: '+err.message,'err');
    if(statusEl) statusEl.textContent=`❌ Error al cargar`;
    if(dzEl) dzEl.style.borderColor='var(--red)';
  }
}

async function analizarDocumentos(){
  if(!QAI.apiKey){notify('Ingresa tu API key de Anthropic primero','err');return;}
  if(!QAI.planosB64 && !QAI.memoriaB64){notify('Sube al menos un documento','err');return;}
  if(QAI.processing){return;}
  QAI.processing=true;

  $('qa-progress').style.display='block';
  $('btn-analizar').disabled=true;
  $('btn-analizar').textContent='⏳ Analizando...';
  $('qa-results').innerHTML='';

  try{
    let mergedResult=null;

    // --- Planos: llamada independiente ---
    if(QAI.planosB64){
      setProgress(15,'📐 Analizando planos (llamada 1/2)...');
      const r=await callAPI(QAI.planosB64, getPlanasPrompt());
      mergedResult=mergeResults(mergedResult, r);
      setProgress(50,'✓ Planos analizados');
    }

    // --- Memoria: llamada independiente (PDF completo, válido) ---
    if(QAI.memoriaB64){
      const paso=QAI.planosB64?'2/2':'1/1';
      setProgress(QAI.planosB64?55:15,`📊 Analizando memoria de cálculo (llamada ${paso})...`);
      const r=await callAPI(QAI.memoriaB64, getMemoPrompt());
      mergedResult=mergeResults(mergedResult, r);
      setProgress(90,'✓ Memoria analizada');
    }

    if(!mergedResult) throw new Error('No se pudo extraer información.');

    setProgress(95,'📋 Pre-llenando presupuesto por niveles...');
    const parsed=parseExtracted(mergedResult);

    // DEBUG — mostrar JSON extraído en consola para diagnóstico
    console.log('=== DATOS EXTRAÍDOS POR LA IA ===');
    console.log(JSON.stringify(mergedResult, null, 2));
    console.log('=== PARSED ===');
    console.log(JSON.stringify(parsed, null, 2));

    applyToPresupuesto(parsed);
    setProgress(100,'✅ Análisis completado');
    renderQAResults(parsed);
    notify('✓ Cuantificación completada','ok');

  }catch(err){
    const errMsg=err.message||'Error desconocido';
    notify('Error: '+errMsg,'err');
    $('qa-results').innerHTML=`
    <div class="card" style="border-color:rgba(240,96,96,.3)">
      <div class="ct" style="color:var(--red)">❌ Error en el análisis</div>
      <div style="font-size:13px;margin-bottom:10px"><strong>${errMsg}</strong></div>
      <div class="alert al-w">
        <div><strong>Causas comunes:</strong>
          <ul style="margin-top:6px;padding-left:16px;line-height:2">
            <li>API key inválida o revocada — verifica en console.anthropic.com</li>
            <li>Sin saldo en tu cuenta de Anthropic — agrega créditos</li>
            <li>PDF protegido con contraseña o corrupto</li>
            <li>Documento con más de 100 páginas — prueba solo los planos primero</li>
          </ul>
        </div>
      </div>
      <div style="font-size:11px;color:var(--mut2);margin-top:8px">💡 F12 → Console para el error completo</div>
    </div>`;
    $('qa-progress').style.display='none';
  }finally{
    QAI.processing=false;
    $('btn-analizar').disabled=false;
    $('btn-analizar').textContent='🤖 Analizar con IA y Pre-llenar Presupuesto';
  }
}

async function callAPI(pdfBase64, userPrompt){
  const content=[
    {type:'document', source:{type:'base64', media_type:'application/pdf', data:pdfBase64}},
    {type:'text', text:userPrompt}
  ];

  const response=await fetch('https://frosty-wave-fa11.gilberto011999.workers.dev',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      apiKey:QAI.apiKey,
      model:'claude-opus-4-5',
      max_tokens:4096,
      system:'Eres un ingeniero estructural experto en República Dominicana. Responde ÚNICAMENTE con JSON válido, sin texto adicional ni markdown.',
      messages:[{role:'user',content}]
    })
  });

  if(!response.ok){
    let errMsg=`Error HTTP ${response.status}`;
    try{const e=await response.json();errMsg=e.error?.message||errMsg;}catch(e){}
    throw new Error(errMsg);
  }

  const data=await response.json();
  if(!data.content?.length) throw new Error('Respuesta vacía de la API. Verifica tu API key y saldo.');
  const text=data.content.map(c=>c.text||'').join('');
  const jsonMatch=text.match(/\{[\s\S]*\}/);
  if(!jsonMatch) throw new Error('La IA no devolvió JSON válido. Intenta de nuevo.');
  try{return JSON.parse(jsonMatch[0]);}
  catch(e){throw new Error('Error parseando respuesta. Intenta de nuevo.');}
}

function mergeResults(base, incoming){
  if(!base) return incoming;
  if(!incoming) return base;

  const proj={...base.proyecto};
  Object.keys(incoming.proyecto||{}).forEach(k=>{
    if(incoming.proyecto[k]!=null) proj[k]=incoming.proyecto[k];
  });

  function safeArr(v){ return Array.isArray(v)?v:[]; }

  function mergeArr(a,b,key='tipo'){
    const map=new Map();
    [...safeArr(a),...safeArr(b)].forEach(item=>{
      const k=(item&&item[key])||JSON.stringify(item);
      if(!map.has(k)) map.set(k,item);
    });
    return Array.from(map.values());
  }

  const bf=base.fundacion||{};
  const inf=incoming.fundacion||{};

  return {
    proyecto:proj,
    fundacion:{
      zapatas:      mergeArr(safeArr(bf.zapatas),      safeArr(inf.zapatas)),
      zapatas_muros:mergeArr(safeArr(bf.zapatas_muros),safeArr(inf.zapatas_muros)),
      platea:bf.platea||inf.platea||null,
    },
    columnas_por_nivel: mergeArr(safeArr(base.columnas_por_nivel), safeArr(incoming.columnas_por_nivel)),
    vigas_por_nivel:    mergeArr(safeArr(base.vigas_por_nivel),    safeArr(incoming.vigas_por_nivel)),
    losas:             [...safeArr(base.losas),    ...safeArr(incoming.losas)],
    mamposteria:        mergeArr(safeArr(base.mamposteria),        safeArr(incoming.mamposteria)),
    cisterna:          base.cisterna||incoming.cisterna||null,
    septico:           base.septico||incoming.septico||null,
    estructura_techo:  base.estructura_techo||incoming.estructura_techo||null,
    dinteles:          base.dinteles||incoming.dinteles||null,
    notas_extraccion:  [...safeArr(base.notas_extraccion),...safeArr(incoming.notas_extraccion)],
    confianza_general: (base.confianza_general==='alta'||incoming.confianza_general==='alta')?'alta':'media',
  };
}

function applyToPresupuesto(parsed){
  const p=parsed.proyecto;
  const alturaEntrepiso=parseFloat(p.altura_entrepiso_m)||ST.project.alto||2.80;
  const niv=parseInt(p.niveles)||ST.project.niveles||2;

  // Auto-fill project data
  if(p.nombre&&!ST.project.nombre) ST.project.nombre=p.nombre;
  if(p.ubicacion&&!ST.project.ubicacion) ST.project.ubicacion=p.ubicacion;
  if(p.niveles) ST.project.niveles=parseInt(p.niveles)||ST.project.niveles;
  if(p.area_m2_por_nivel) ST.project.area=p.area_m2_por_nivel*(parseInt(p.niveles)||1);
  if(p.altura_entrepiso_m) ST.project.alto=parseFloat(p.altura_entrepiso_m);

  // ── HELPERS ──────────────────────────────────────────────────

  // Normalize section string from ANY field name the AI might use
  function getSeccion(obj){
    const raw = obj.seccion_cm || obj.dimensiones_cm || obj.seccion ||
                obj.dimension_cm || obj.seccion_transversal || null;
    if(!raw) return null;
    return String(raw).trim();
  }

  // Parse "30x20", "20x30", "0.20x0.30" → {w, h} in meters
  function parseSeccion(s){
    if(!s) return null;
    const clean=String(s).replace(/\s/g,'').replace(/[xX×]/,'|');
    const m=clean.match(/([\d.]+)\|([\d.]+)/);
    if(!m) return null;
    let w=parseFloat(m[1]), h=parseFloat(m[2]);
    // If values > 2, they're in cm → convert to m
    if(w>2) w=w/100;
    if(h>2) h=h/100;
    return {w, h};
  }

  // Parse nivel string "N1", "Story1", "Entrepiso 1", 1, "N1-N3" → array of ints
  function parseNiveles(val, totalNiv){
    if(!val) return Array.from({length:totalNiv},(_,i)=>i+1);
    if(typeof val==='number') return [val];
    const s=String(val).trim();
    // Range like "N1-N3" or "Story1-Story3"
    const range=s.match(/(\d+)[^\d]+(\d+)/);
    if(range){
      const from=parseInt(range[1]), to=parseInt(range[2]);
      return Array.from({length:to-from+1},(_,i)=>from+i);
    }
    // Single like "N1", "Story2", "Entrepiso 1", "1"
    const single=s.match(/(\d+)/);
    if(single) return [parseInt(single[1])];
    return Array.from({length:totalNiv},(_,i)=>i+1);
  }

  // Get espesor in meters from any format
  function getEspesor(obj){
    const raw=obj.espesor_m||obj.espesor_cm||null;
    if(!raw) return 0.12; // default
    if(Array.isArray(raw)) return parseFloat(raw[0])>1 ? parseFloat(raw[0])/100 : parseFloat(raw[0]);
    const v=parseFloat(raw);
    return v>1 ? v/100 : v; // cm → m
  }

  function colVol(col){
    if(col.volumen_m3_por_nivel>0) return col.volumen_m3_por_nivel;
    const sec=parseSeccion(getSeccion(col));
    if(!sec) return 0;
    const cant=parseFloat(col.cantidad_por_planta||col.cantidad_estimada)||1;
    const h=parseFloat(col.altura_m)||alturaEntrepiso;
    return parseFloat((sec.w*sec.h*h*cant).toFixed(3));
  }

  function vigaVol(viga){
    if(viga.volumen_m3_por_nivel>0) return viga.volumen_m3_por_nivel;
    const sec=parseSeccion(getSeccion(viga));
    if(!sec) return 0;
    const lng=parseFloat(viga.longitud_total_ml)||0;
    if(!lng) return parseFloat((sec.w*sec.h*5).toFixed(3)); // estimate 5m
    return parseFloat((sec.w*sec.h*lng).toFixed(3));
  }

  function losaVol(losa){
    if(losa.volumen_m3>0) return losa.volumen_m3;
    const area=parseFloat(losa.area_m2)||p.area_m2_por_nivel||0;
    const esp=getEspesor(losa);
    return parseFloat((area*esp).toFixed(3));
  }

  function zapataVol(z){
    if(z.volumen_m3>0) return z.volumen_m3;
    const lx=parseFloat(z.lx_m||z.largo_m)||0;
    const ly=parseFloat(z.ly_m||z.ancho_m)||0;
    const h=parseFloat(z.h_m||z.alto_m)||0.35;
    const cant=parseFloat(z.cantidad)||1;
    if(!lx||!ly) return 0;
    return parseFloat((lx*ly*h*cant).toFixed(3));
  }

  function zapMuroVol(zm){
    if(zm.volumen_m3>0) return zm.volumen_m3;
    const a=parseFloat(zm.ancho_m)||0;
    const lng=parseFloat(zm.longitud_total_ml||zm.longitud_ml)||0;
    const h=parseFloat(zm.h_m)||0.20;
    if(!a||!lng) return 0;
    return parseFloat((a*lng*h).toFixed(3));
  }

  // ── FUNDACIÓN ────────────────────────────────────────────────
  if(!ST.sections['bnp-ha']) ST.sections['bnp-ha']=[];

  (parsed.fundacion?.zapatas||[]).forEach(z=>{
    const vol=zapataVol(z);
    const pu=getACUTotal(z.acuSugerido||'103.07');
    ST.sections['bnp-ha'].push({
      id:uid(),sg:'ha-zapata',
      desc:`ZAPATA ${z.tipo||'Z'} ${z.lx_m||'?'}×${z.ly_m||'?'}×${z.h_m||0.35}m (×${z.cantidad||1})`,
      qty:vol,und:'M3',pu,total:parseFloat((pu*vol).toFixed(2)),
      acuCod:z.acuSugerido||'103.07',isManual:false,manualDesc:'',manualPU:0
    });
  });

  (parsed.fundacion?.zapatas_muros||[]).forEach(zm=>{
    const vol=zapMuroVol(zm);
    const pu=getACUTotal(zm.acuSugerido||'103.04');
    ST.sections['bnp-ha'].push({
      id:uid(),sg:'ha-zapata',
      desc:`ZAPATA MURO ${zm.tipo||'ZM'} ${zm.ancho_m||'?'}m — ${zm.longitud_total_ml||'?'} ml`,
      qty:vol,und:'M3',pu,total:parseFloat((pu*vol).toFixed(2)),
      acuCod:zm.acuSugerido||'103.04',isManual:false,manualDesc:'',manualPU:0
    });
  });

  // ── COLUMNAS ─────────────────────────────────────────────────
  (parsed.columnas||[]).forEach(col=>{
    const sec=parseSeccion(getSeccion(col));
    if(!sec) return; // skip if no section (e.g. steel HSS or unknown)
    const niveles=parseNiveles(col.nivel||col.niveles, niv);
    const vol=colVol(col);
    const cant=parseFloat(col.cantidad_por_planta||col.cantidad_estimada)||1;
    const pu=getACUTotal(col.acuSugerido||'104.12');
    const secStr=getSeccion(col)||'?';
    niveles.forEach(n=>{
      const secId=`n${n}-ha`;
      if(!ST.sections[secId]) ST.sections[secId]=[];
      ST.sections[secId].push({
        id:uid(),sg:'ha-col',
        desc:`COLUMNA ${col.tipo||col.seccion||'C'} ${secStr}cm — ${col.armadura_long||col.armadura||''} (×${cant})`,
        qty:vol,und:'M3',pu,total:parseFloat((pu*vol).toFixed(2)),
        acuCod:col.acuSugerido||'104.12',isManual:false,manualDesc:'',manualPU:0
      });
    });
  });

  // ── VIGAS ────────────────────────────────────────────────────
  (parsed.vigas||[]).forEach(viga=>{
    const sec=parseSeccion(getSeccion(viga));
    if(!sec) return;
    const niveles=parseNiveles(viga.nivel||viga.niveles, niv);
    const vol=vigaVol(viga);
    const pu=getACUTotal(viga.acuSugerido||'105.07');
    const secStr=getSeccion(viga)||'?';
    niveles.forEach(n=>{
      const secId=`n${n}-ha`;
      if(!ST.sections[secId]) ST.sections[secId]=[];
      ST.sections[secId].push({
        id:uid(),sg:'ha-viga',
        desc:`VIGA ${viga.tipo||viga.seccion||'V'} ${secStr}cm — ${viga.longitud_total_ml||'?'} ml`,
        qty:vol,und:'M3',pu,total:parseFloat((pu*vol).toFixed(2)),
        acuCod:viga.acuSugerido||'105.07',isManual:false,manualDesc:'',manualPU:0
      });
    });
  });

  // ── LOSAS ────────────────────────────────────────────────────
  (parsed.losas||[]).forEach(losa=>{
    // Skip entries without espesor (generic entries like "N1 - losa de entrepiso")
    const esp=getEspesor(losa);
    if(!esp) return;
    const niveles=parseNiveles(losa.nivel||losa.niveles, niv);
    const vol=losaVol(losa);
    const area=parseFloat(losa.area_m2)||p.area_m2_por_nivel||0;
    const pu=getACUTotal(losa.acuSugerido||(esp<=0.12?'108.05':esp<=0.14?'108.13':'108.17'));
    niveles.forEach(n=>{
      const secId=`n${n}-ha`;
      if(!ST.sections[secId]) ST.sections[secId]=[];
      ST.sections[secId].push({
        id:uid(),sg:'ha-losa',
        desc:`LOSA HA e=${esp}m ${losa.acero||losa.armadura_principal||'Ø3/8"@0.25'} — ${area} m²`,
        qty:vol,und:'M3',pu,total:parseFloat((pu*vol).toFixed(2)),
        acuCod:losa.acuSugerido||(esp<=0.12?'108.05':esp<=0.14?'108.13':'108.17'),
        isManual:false,manualDesc:'',manualPU:0
      });
    });
  });

  // ── MAMPOSTERÍA ──────────────────────────────────────────────
  (parsed.mamposteria||[]).forEach(mamp=>{
    const niveles=parseNiveles(mamp.nivel||mamp.niveles, niv);
    const area=parseFloat(mamp.area_m2_por_nivel)||0;
    const pu=getACUTotal(mamp.acuSugerido||'113.05');
    const tipo=mamp.tipo||'6"';
    const sep=parseFloat(mamp.separacion_bastones_m)||0.40;
    niveles.forEach(n=>{
      const secId=`n${n}-mamp`;
      if(!ST.sections[secId]) ST.sections[secId]=[];
      ST.sections[secId].push({
        id:uid(),sg:'mamp-bloques',
        desc:`BLOQUES ${tipo} bastones @${sep}m`,
        qty:area,und:'M2',pu,total:parseFloat((pu*area).toFixed(2)),
        acuCod:mamp.acuSugerido||'113.05',isManual:false,manualDesc:'',manualPU:0
      });
    });
  });

  // ── CISTERNA ─────────────────────────────────────────────────
  if(parsed.cisterna){
    const c=parsed.cisterna;
    if(!ST.sections['ext-san']) ST.sections['ext-san']=[];
    const pu=getACUTotal(c.acuSugerido||'116.41');
    ST.sections['ext-san'].push({
      id:uid(),sg:'san-cisterna',
      desc:`CISTERNA ${c.largo_m||'?'}×${c.ancho_m||'?'}×${c.prof_m||'?'}m`,
      qty:1,und:'UND',pu,total:pu,
      acuCod:c.acuSugerido||'116.41',isManual:false,manualDesc:'',manualPU:0
    });
  }

  // ── SÉPTICO ──────────────────────────────────────────────────
  if(parsed.septico){
    const s=parsed.septico;
    if(!ST.sections['ext-san']) ST.sections['ext-san']=[];
    const pu=getACUTotal(s.acuSugerido||'116.39');
    ST.sections['ext-san'].push({
      id:uid(),sg:'san-cisterna',
      desc:`CÁMARA SÉPTICA ${s.largo_m||'?'}×${s.ancho_m||'?'}×${s.prof_m||'?'}m`,
      qty:1,und:'UND',pu,total:pu,
      acuCod:s.acuSugerido||'116.39',isManual:false,manualDesc:'',manualPU:0
    });
  }

  buildSidebar();
  recalcTotals();
  ST.calcDone=true;
  autoSave();
}

function renderQAResults(parsed){
  const res=$('qa-results');
  const p=parsed.proyecto;

  // Build confidence table from what was actually applied to ST.sections
  const allSecs=[...BNP_SECTIONS,...EXT_SECTIONS];
  for(let n=1;n<=(ST.project.niveles||2);n++) levelSections(n).forEach(s=>allSecs.push(s));

  const rows=[];
  allSecs.forEach(sec=>{
    const items=ST.sections[sec.id]||[];
    items.forEach(item=>{
      const qty=parseFloat(item.qty)||0;
      const hasVol=qty>0;
      // Determine confidence
      let conf,confColor,confLabel;
      if(item.isManual){conf='manual';confColor='var(--blue)';confLabel='✏ Manual';}
      else if(hasVol&&item.acuCod){conf='alta';confColor='var(--green)';confLabel='✅ Alta';}
      else if(!hasVol&&item.acuCod){conf='media';confColor='var(--acc)';confLabel='⚠ Verificar qty';}
      else{conf='baja';confColor='var(--red)';confLabel='❌ Sin cantidad';}

      const secLabel=allSecs.find(s=>s.id===sec.id)?.label||sec.id;
      rows.push(`<tr>
        <td><span class="pill pb" style="font-size:9px">${secLabel}</span></td>
        <td style="font-size:11px">${item.desc||item.manualDesc||'Partida'}</td>
        <td class="td-r" style="font-family:var(--fm);font-size:11px">${qty>0?fmtN(qty,3)+' '+item.und:'—'}</td>
        <td class="td-p" style="font-size:11px">${item.total>0?fmt(item.total):'—'}</td>
        <td style="font-size:10.5px;font-weight:600;color:${confColor}">${confLabel}</td>
      </tr>`);
    });
  });

  const totalPartidas=rows.length;
  const totalImporte=Object.values(ST.sections).flat().reduce((s,i)=>s+i.total,0);

  res.innerHTML=`
  <div class="card" style="border-color:rgba(61,214,140,.3)">
    <div class="ct" style="font-size:14px">✅ Análisis Completado — Confianza: ${parsed.confianza||parsed.confianza_general||'alta'}</div>

    <!-- Proyecto detectado -->
    <div style="background:var(--s2);border-radius:var(--rs);padding:12px;margin-bottom:12px">
      <div class="sdiv" style="margin-bottom:8px">Datos del Proyecto Detectados</div>
      <div class="g2" style="font-size:12px">
        ${[
          ['Proyecto',p.nombre||'—'],['Ubicación',p.ubicacion||'—'],
          ['Área/nivel',p.area_m2_por_nivel?p.area_m2_por_nivel+' m²':'—'],
          ['Niveles',p.niveles||'—'],['Alt. entrepiso',p.altura_entrepiso_m?p.altura_entrepiso_m+'m':'—'],
          ["f'c",p.fc_hormigon_kg_cm2?p.fc_hormigon_kg_cm2+' kg/cm²':'—'],
          ['Zona sísmica',p.zona_sismica||'—'],['Fundación',p.tipo_fundacion||'—'],
        ].map(([l,v])=>`<div><span style="color:var(--mut);font-size:10px">${l}</span><br><strong>${v}</strong></div>`).join('')}
      </div>
    </div>

    <!-- Resumen -->
    <div style="display:flex;gap:10px;margin-bottom:12px">
      <div class="kpi grn" style="flex:1;padding:10px">
        <div class="kpi-l">Partidas pre-cargadas</div>
        <div class="kpi-v">${totalPartidas}</div>
      </div>
      <div class="kpi acc" style="flex:1;padding:10px">
        <div class="kpi-l">Importe detectado</div>
        <div class="kpi-v" style="font-size:16px">${fmt(totalImporte)}</div>
      </div>
    </div>

    <!-- Tabla de confianza -->
    <div class="ct">Partidas pre-cargadas en el presupuesto</div>
    <div style="font-size:10.5px;color:var(--mut2);margin-bottom:8px">
      ✅ Alta = cantidad calculada desde dimensiones explícitas &nbsp;·&nbsp;
      ⚠ Verificar = elemento detectado pero sin cantidad &nbsp;·&nbsp;
      ✏ Manual = ingresado por el usuario
    </div>
    <div class="tw"><table>
      <thead><tr>
        <th>Sección</th><th>Descripción</th>
        <th class="td-r">Cantidad</th><th class="td-r">Total (RD$)</th>
        <th>Confianza</th>
      </tr></thead>
      <tbody>${rows.length?rows.join(''):'<tr><td colspan="5" style="text-align:center;color:var(--mut2);padding:16px">Sin partidas detectadas</td></tr>'}</tbody>
    </table></div>

    <!-- Notas -->
    ${parsed.notas?.length?`
    <div style="margin-top:10px">
      <div class="sdiv" style="margin-bottom:5px">Notas del análisis</div>
      <ul style="padding-left:16px;font-size:10.5px;color:var(--mut2);line-height:1.8">
        ${parsed.notas.map(n=>`<li>${n}</li>`).join('')}

    <div class="alert al-g" style="margin-top:10px">
      ✅ Revisa las cantidades marcadas como ⚠ — el programa detectó el elemento pero necesitas confirmar o ingresar la cantidad manualmente en la sección correspondiente del menú.
    </div>
    <div style="text-align:center;margin-top:10px">
      <button class="btn btn-p btn-lg" onclick="nav('dashboard')">Ver Dashboard →</button>

}

function itemItems(items){
  const confColor={alta:'var(--green)',media:'var(--acc)',estimado:'var(--acc)',baja:'var(--red)'};
  const confLabel={alta:'✅ Alta',media:'⚠ Media',estimado:'⚠ Estimado',baja:'❌ Baja'};
  return items.map(item=>`
    <tr>
      <td><span class="pill pb">${item.cat}</span></td>
      <td style="font-size:11.5px">${item.desc}</td>
      <td class="td-r" style="font-family:var(--fm);font-size:11.5px">${item.val}</td>
      <td><span style="color:${confColor[item.conf]||'var(--acc)'};font-size:11px;font-weight:600">${confLabel[item.conf]||item.conf}</span></td>
    </tr>`).join('');
}

const LS_KEY = 'presupuestord_v3';

function autoSave(){
  try{
    const data={
      project: ST.project,
      sections: ST.sections,
      platea: ST.platea,
      calcDone: ST.calcDone,
      totals: ST.totals,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }catch(e){
    // localStorage lleno o bloqueado — ignorar silenciosamente
  }
}

function autoLoad(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.project) return false;
    ST.project=data.project||ST.project;
    ST.sections=data.sections||{};
    ST.platea=data.platea||ST.platea;
    ST.calcDone=data.calcDone||false;
    ST.totals=data.totals||{};
    return true;
  }catch(e){
    return false;
  }
}

function nuevoProyecto(){
  if(!confirm('¿Seguro que quieres empezar un proyecto nuevo?\n\nSe borrará todo el trabajo actual.\nTe recomendamos guardar primero (botón 💾 Guardar).')){
    return;
  }
  localStorage.removeItem(LS_KEY);
  ST.project={nombre:'',empresa:'',ingeniero:'',ubicacion:'',
    niveles:2,area:120,perimetro:50,alto:2.8,
    banos:2,cocinas:1,fund:'zapatas',

  ST.sections={};
  ST.platea={cfg:null,area:0,perim:0,total:0};
  ST.calcDone=false;
  ST.totals={};
  buildSidebar();
  nav('dashboard');
  notify('✓ Proyecto nuevo — listo para empezar','ok');
}

function exportarJSON(){
  try{
    const data={
      meta:{
        version:'3.0',
        app:'PresupuestoRD Pro',
        exportadoEn: new Date().toLocaleString('es-DO'),
      },
      project: ST.project,
      sections: ST.sections,
      platea: ST.platea,
      calcDone: ST.calcDone,
      totals: ST.totals,
    };
    const json=JSON.stringify(data, null, 2);
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    const nombre=(ST.project.nombre||'proyecto').replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    a.download=`Presupuesto_${nombre}_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    notify('✓ Proyecto guardado como JSON','ok');
  }catch(e){
    notify('Error al exportar: '+e.message,'err');
  }
}

function importarJSON(event){
  const file=event.target.files?.[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      // Validar que es un archivo válido
      if(!data.project||!data.sections){
        notify('Archivo JSON inválido — no es un proyecto de PresupuestoRD','err');
        return;
      }
      if(!confirm(`¿Cargar el proyecto "${data.project.nombre||'Sin nombre'}"?\n\nEsto reemplazará el trabajo actual.`)){
        return;
      }
      ST.project=data.project||ST.project;
      ST.sections=data.sections||{};
      ST.platea=data.platea||ST.platea;
      ST.calcDone=data.calcDone||false;
      ST.totals=data.totals||{};
      autoSave(); // guardar en localStorage también
      buildSidebar();
      nav('dashboard');
      notify(`✓ Proyecto "${data.project.nombre||'Sin nombre'}" cargado correctamente`,'ok');
    }catch(e){
      notify('Error al leer el archivo: '+e.message,'err');
    }
  };
  reader.readAsText(file,'UTF-8');
  // Reset input para permitir cargar el mismo archivo dos veces
  event.target.value='';
}

}

// APU helper — get material price
function getMatPU(matId){
  const m=MAT_DB.find(x=>x.id===matId);
  return m?m.pu:0;
}

// Blank APU template
function newAPU(){
  return {
    id:'apu_'+uid(),
    code:'APU-'+(ST.apus.length+1).toString().padStart(3,'0'),
    titulo:'',
    und:'M2',
    categoria:'Mampostería',
    tipo:'completo', // completo | parcial | global
    materiales:[], // [{matId|manualDesc, und, cant, pu}]
    mo:[],         // [{moId|manualDesc, und, cant, jornal, pu_mo}]
    herramienta_pct:5,
    overhead_pct:0,
    itbis_mat:true,
    notas:'',
    // Calculated
    total_mat:0, total_mo:0, total_herr:0, total_oh:0, total:0,
    createdAt: new Date().toISOString(),
  };
}

function calcAPU(apu){
  // Materials
  apu.total_mat=apu.materiales.reduce((s,m)=>{
    const pu=m.manualPU||m.pu||0;
    return s+(pu*(m.cant||0));
  },0);
  // ITBIS on materials (18%)
  const itbis_mat=apu.itbis_mat?apu.total_mat*0.18:0;
  // MO
  apu.total_mo=apu.mo.reduce((s,m)=>{
    // dias_x_und = cant / rend (if rend provided) or cant directly
    const pu_mo=m.pu_mo||m.pu||0;
    return s+(pu_mo*(m.cant||0));
  },0);
  // Herramienta
  apu.total_herr=apu.total_mo*(apu.herramienta_pct/100);
  // Overhead
  apu.total_oh=(apu.total_mat+itbis_mat+apu.total_mo+apu.total_herr)*(apu.overhead_pct/100);
  // Total
  apu.total=apu.total_mat+itbis_mat+apu.total_mo+apu.total_herr+apu.total_oh;
  return apu;
}

// ── APU → ACU DB integration ───────────────────────────────────
function apuToACU(apu){
  // Add to ACU_DB as a custom entry so it appears in section selectors
  const cod='APU.'+apu.code.replace('APU-','');
  const existing=ACU_DB.findIndex(r=>r.cod===cod);
  const entry={cod,desc:apu.titulo||apu.code,und:apu.und,total:apu.total,isAPU:true,apuId:apu.id};
  if(existing>=0) ACU_DB[existing]=entry;
  else ACU_DB.push(entry);
}

    const calC=parseFloat((byPct(0.014)/calPU).toFixed(4));
    const moC=parseFloat((byPct(0.52)/moEmpPU).toFixed(3));
    const sumado=(cemC*cemPU)+(areC*arePU)+(calC*calPU)+(moC*moEmpPU);
    return [
      row('MAT','Cemento Gris 94 lbs.',cemC,'FDA',cemPU),
      row('MAT','Arena fina para empañete',areC,'M3',arePU),
      row('MAT','Cal Grande hidratada',calC,'FDA',calPU),
      row('MO','Empañete maestreado (T3+AY) M2',moC,'M2',moEmpPU),
      row('IND','Andamios + herramienta + ITBIS',1,'GLB',parseFloat(Math.max(t-sumado,0).toFixed(2))),
    ];
  }
  // Pintura (115.xx)
  if(cod.startsWith('115.')){
    const pintPU=1250,sellPU=850;
    const moPintPU=MO_DB.find(m=>m.cod==='900.01')?.pu||110;
    const pintC=parseFloat((byPct(0.48)/pintPU).toFixed(3));
    const sellC=parseFloat((byPct(0.16)/sellPU).toFixed(3));
    const moC=parseFloat((byPct(0.27)/moPintPU).toFixed(3));
    const sumado=(pintC*pintPU)+(sellC*sellPU)+(moC*moPintPU);
    return [
      row('MAT','Pintura acrílica preparada (gal)',pintC,'GL',pintPU),
      row('MAT','Sellador/fijador (gal)',sellC,'GL',sellPU),
      row('MO','Aplicación pintura (T3) M2',moC,'M2',moPintPU),
      row('IND','Herramienta + ITBIS mat.',1,'GLB',parseFloat(Math.max(t-sumado,0).toFixed(2))),
    ];
  }
  return null;
}

function getMatPUByDesc(desc){
  const m=MAT_DB.find(x=>x.desc.toLowerCase().includes(desc.toLowerCase()));
  return m?m.pu:3110;
}

function crearDesdeACU(cod){
  const acu=ACU_DB.find(r=>r.cod===cod);
  if(!acu)return;
  const apu=newAPU();
  apu.titulo=acu.desc;
  apu.und=acu.und;
  apu.notas=`Basado en ACU ${cod} — precio ref: ${fmt(acu.total)}/${acu.und}`;
  ST.apus.push(apu);
  autoSave();
  renderAPUEditor(apu.id);
}

function crearAPU(){
  const apu=newAPU();
  ST.apus.push(apu);
  autoSave();
  renderAPUEditor(apu.id);
}

function renderAPUCard(apu,idx){
  calcAPU(apu);
  const isSaved=ACU_DB.some(r=>r.apuId===apu.id);
  return `<div class="el-card" style="margin-bottom:10px">
    <div class="el-head">
      <div>
        <span class="el-num">${apu.code}</span>
        <strong style="margin-left:8px;font-size:13px">${apu.titulo||'Sin título'}</strong>
        <span class="bdg" style="margin-left:6px">${apu.und}</span>
        ${isSaved?'<span class="pill pg" style="margin-left:6px;font-size:9px">En base de precios</span>':''}
      </div>
      <div style="display:flex;gap:7px;align-items:center">
        <span class="el-tot">${fmt(apu.total)}</span>
        <button class="btn btn-sm btn-s" onclick="renderAPUEditor('${apu.id}')">✏ Editar</button>

function guardarAPUenACU(id){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  calcAPU(apu);
  apuToACU(apu);
  autoSave();
  notify(`✓ APU "${apu.titulo}" guardado en base de precios como ${apu.code}`,'ok');
  renderAPU();
}

function eliminarAPU(id){
  if(!confirm('¿Eliminar este APU?'))return;
  ST.apus=ST.apus.filter(a=>a.id!==id);
  // Remove from ACU_DB if saved
  const idx=ACU_DB.findIndex(r=>r.apuId===id);
  if(idx>=0) ACU_DB.splice(idx,1);
  autoSave();
  renderAPU();
}

function renderAPUEditor(id){

  if(!apu)return;

  const mc=$('main-content');

  mc.innerHTML=`
  <div class="sh">
    <div><div class="st">Editor APU — ${apu.code}</div><div class="ss">Análisis de Precio Unitario personalizado</div></div>
    <div class="btn-row">
      <button class="btn btn-s" onclick="renderAPU()">← Volver</button>

    <div class="g2">
      <div class="field"><label>Código APU</label>

      </div>

    <div class="field"><label>Descripción / Título</label>
      <input id="apu-titulo" value="${apu.titulo}" placeholder="Ej: BLOQUES 8\" @0.60m con hormigón industrial 210 kg/cm²" onchange="updateAPUField('${id}','titulo',this.value)"/>
    </div>
    <div class="g2">
      <div class="field"><label>Categoría</label>
        <select onchange="updateAPUField('${id}','categoria',this.value)">
          ${['Mampostería','Hormigón Armado','Fundación','Pisos','Pintura','Terminaciones','Sanitarias','Eléctricas','Carpintería','Movimiento de Tierra','Estructura Metálica','Impermeabilizante','Otro'].map(c=>`<option ${apu.categoria===c?'selected':''}>${c}</option>`).join('')}

      </div>
      <div class="field"><label>Tipo de APU</label>
        <select onchange="updateAPUField('${id}','tipo',this.value)">

    <div class="field"><label>Precio total por ${apu.und} (RD$)</label>
      <input type="number" step="0.01" id="apu-global-price" value="${apu.total||''}"
        onchange="setAPUGlobal('${id}',parseFloat(this.value)||0)"/>
    </div>
    <div class="field"><label>Notas / Proveedor</label>
      <textarea rows="2" onchange="updateAPUField('${id}','notas',this.value)">${apu.notas}</textarea>
    </div>

  <!-- MATERIALES -->
  <div class="card">
    <div class="ct">Materiales <span class="bdg">${fmt(apu.total_mat)}</span>
      <label style="margin-left:8px;font-size:11px;color:var(--mut2);display:inline-flex;align-items:center;gap:4px;cursor:pointer">
        <input type="checkbox" ${apu.itbis_mat?'checked':''} onchange="updateAPUField('${id}','itbis_mat',this.checked)"> ITBIS (18%) sobre materiales
      </label>
    </div>
    <div id="apu-mat-list-${id}">

    <div class="g2" style="margin-top:8px">
      <div class="field"><label>Agregar material de la base</label>

function MAT_CAT_GROUPED(){
  const cats={};
  MAT_DB.forEach(m=>{if(!cats[m.cat])cats[m.cat]=[];cats[m.cat].push(m);});
  return Object.entries(cats).map(([cat,items])=>
    `<optgroup label="${cat}">${items.map(m=>`<option value="${m.id}">${m.desc} — ${fmt(m.pu)}/${m.und}</option>`).join('')}</optgroup>`
  ).join('');
}

function renderAPUMatRow(apuId,m,idx){
  const isMan=m.isManual||!m.matId;
  return `<div class="el-card" style="padding:9px;margin-bottom:6px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="pill pb" style="font-size:9px;flex-shrink:0">MAT</span>
      ${isMan?`<input type="text" value="${(m.manualDesc||m.desc||'').replace(/"/g,'&quot;')}" placeholder="Nombre del material (ej: Ladrillos)"
        style="flex:1;min-width:140px;background:var(--s2);border:1px solid rgba(232,160,32,.3);border-radius:4px;color:var(--acc);padding:4px 7px;font-size:11.5px"
        onchange="updateAPUMatField('${apuId}',${idx},'manualDesc',this.value);updateAPUMatField('${apuId}',${idx},'desc',this.value)"/>`
      :`<span style="flex:1;font-size:12px;min-width:120px">${m.desc||'—'}</span>`}
      <input type="number" step="0.001" value="${m.cant||''}" placeholder="Cant./und"
        title="Cantidad por unidad de obra"
        style="width:80px;background:var(--s2);border:1px solid var(--bd2);border-radius:4px;color:var(--txt);padding:4px 6px;font-size:11px"
        onchange="updateAPUMatField('${apuId}',${idx},'cant',parseFloat(this.value)||0)"/>
      ${isMan?`<input type="text" value="${m.und||'UND'}" placeholder="UND"
        style="width:52px;background:var(--s2);border:1px solid var(--bd2);border-radius:4px;color:var(--txt);padding:4px 5px;font-size:11px"
        onchange="updateAPUMatField('${apuId}',${idx},'und',this.value)"/>`
      :`<span style="font-size:10.5px;color:var(--mut2)">${m.und||'UND'}</span>`}
      <input type="number" step="0.01" value="${m.pu||m.manualPU||''}" placeholder="P.U."
        style="width:90px;background:var(--s2);border:1px solid var(--bd2);border-radius:4px;color:var(--txt);padding:4px 6px;font-size:11px"
        onchange="updateAPUMatField('${apuId}',${idx},'pu',parseFloat(this.value)||0)"/>
      <span style="font-size:11px;color:var(--green);width:90px;text-align:right;font-family:var(--fm)">${fmt((m.cant||0)*(m.pu||m.manualPU||0))}</span>
      <button class="btn btn-r btn-sm" onclick="removeAPUMat('${apuId}',${idx})">✕</button>
    </div>
  </div>`;
}

function renderAPUMORow(apuId,m,idx){
  const isMan=m.isManual||!m.moId;
  const jornalOpts=Object.entries(JORNALES).map(([k,j])=>`<option value="${k}" ${m.jornal===k?'selected':''}>${j.label} — ${fmt(j.pu)}/día</option>`).join('');
  return `<div class="el-card" style="padding:9px;margin-bottom:6px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="pill pg" style="font-size:9px;flex-shrink:0">MO</span>
      ${isMan?`<input type="text" value="${(m.manualDesc||m.desc||'').replace(/"/g,'&quot;')}" placeholder="Actividad (ej: Instalación ladrillos)"
        style="flex:1;min-width:140px;background:var(--s2);border:1px solid rgba(61,214,140,.3);border-radius:4px;color:var(--green);padding:4px 7px;font-size:11.5px"
        onchange="updateAPUMOField('${apuId}',${idx},'manualDesc',this.value);updateAPUMOField('${apuId}',${idx},'desc',this.value)"/>`
      :`<span style="flex:1;font-size:12px;min-width:140px">${m.desc||m.manualDesc||'—'}</span>`}
      <select style="font-size:11px;background:var(--s2);border:1px solid var(--bd2);border-radius:4px;color:var(--txt);padding:3px 5px"
        onchange="updateAPUMOField('${apuId}',${idx},'jornal',this.value)">
        <option value="">— Tipo obrero —</option>
        ${jornalOpts}
      </select>
      <input type="number" step="0.001" value="${m.cant||''}" placeholder="Días/und"
        title="Días de trabajo por unidad de obra = 1 ÷ rendimiento"
        style="width:75px;background:var(--s2);border:1px solid var(--bd2);border-radius:4px;color:var(--txt);padding:4px 6px;font-size:11px"
        onchange="updateAPUMOField('${apuId}',${idx},'cant',parseFloat(this.value)||0)"/>
      <span style="font-size:10px;color:var(--mut2)">días/und</span>
      <input type="number" step="0.01" value="${m.pu_mo||''}" placeholder="P.U. MO"
        style="width:85px;background:var(--s2);border:1px solid var(--bd2);border-radius:4px;color:var(--txt);padding:4px 6px;font-size:11px"
        onchange="updateAPUMOField('${apuId}',${idx},'pu_mo',parseFloat(this.value)||0)"/>
      <span style="font-size:11px;color:var(--green);width:90px;text-align:right;font-family:var(--fm)">${fmt((m.cant||0)*(m.pu_mo||0))}</span>
      <button class="btn btn-r btn-sm" onclick="removeAPUMO('${apuId}',${idx})">✕</button>
    </div>
    ${m.rend?`<div style="font-size:10px;color:var(--mut2);margin-top:3px;padding-left:4px">
      Rendimiento ref: <strong>${m.rend} ${m.und}/día</strong> → días/und = ${(1/m.rend).toFixed(4)}
    </div>`:''}
  </div>`;
}

function renderAPUSummary(apu){
  calcAPU(apu);
  const itbis=apu.itbis_mat?apu.total_mat*0.18:0;
  return `<div class="ct">Resumen APU</div>
  <table style="width:100%"><tbody>
    <tr><td>Materiales</td><td class="td-r">${fmt(apu.total_mat)}</td></tr>
    ${apu.itbis_mat?`<tr><td style="color:var(--mut2)">ITBIS materiales (18%)</td><td class="td-r" style="color:var(--mut2)">${fmt(itbis)}</td></tr>`:''}
    <tr><td>Mano de obra</td><td class="td-r">${fmt(apu.total_mo)}</td></tr>
    <tr><td>Herramienta (${apu.herramienta_pct}% MO)</td><td class="td-r">${fmt(apu.total_herr)}</td></tr>
    ${apu.overhead_pct?`<tr><td>Overhead (${apu.overhead_pct}%)</td><td class="td-r">${fmt(apu.total_oh)}</td></tr>`:''}
  </tbody></table>
  <div class="trow" style="margin-top:8px">
    <span class="trow-l">PRECIO UNITARIO — ${apu.und}</span>
    <span class="trow-v">${fmt(apu.total)}</span>
  </div>
  <div style="font-size:10.5px;color:var(--mut2);margin-top:5px">
    ${apu.titulo?`<strong>${apu.titulo}</strong> · `:''} 
    Materiales: ${apu.total>0?(apu.total_mat/apu.total*100).toFixed(0):0}% · 
    MO: ${apu.total>0?(apu.total_mo/apu.total*100).toFixed(0):0}% · 
    Indirectos: ${apu.total>0?((apu.total_herr+apu.total_oh+itbis)/apu.total*100).toFixed(0):0}%
  </div>`;
}

// Update helpers
function updateAPUField(id,field,value){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  apu[field]=value;
  calcAPU(apu);
  autoSave();
  const res=$(`apu-resumen-${id}`);
  if(res)res.innerHTML=renderAPUSummary(apu);
}

function setAPUGlobal(id,price){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  apu.total_mat=0;apu.total_mo=0;apu.total_herr=0;apu.total_oh=0;
  apu.total=price;
  autoSave();
  const res=$(`apu-resumen-${id}`);
  if(res)res.innerHTML=renderAPUSummary(apu);
}

function addAPUMat(id,manual){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  if(manual){
    apu.materiales.push({manualDesc:'',und:'UND',cant:0,pu:0,isManual:true});
  } else {
    const sel=$(`mat-add-sel-${id}`);
    if(!sel||!sel.value)return;
    const mat=MAT_DB.find(m=>m.id===sel.value);
    if(!mat)return;
    apu.materiales.push({matId:mat.id,desc:mat.desc,und:mat.und,cant:0,pu:mat.pu});
    sel.value='';
  }
  calcAPU(apu);autoSave();
  renderAPUEditor(id);
}

function removeAPUMat(id,idx){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  apu.materiales.splice(idx,1);
  calcAPU(apu);autoSave();renderAPUEditor(id);
}

function updateAPUMatField(id,idx,field,value){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu||!apu.materiales[idx])return;
  apu.materiales[idx][field]=value;
  calcAPU(apu);autoSave();
  const res=$(`apu-resumen-${id}`);
  if(res)res.innerHTML=renderAPUSummary(apu);
}

function addAPUMO(id,manual){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  if(manual){
    apu.mo.push({manualDesc:'',und:'UND',cant:0,pu_mo:0,isManual:true});
  } else {
    const sel=$(`mo-add-sel-${id}`);
    if(!sel||!sel.value)return;
    const mo=MO_DB.find(m=>m.cod===sel.value);
    if(!mo)return;
    // dias_x_und = 1/rendimiento si rend disponible
    const dias=mo.rend?parseFloat((1/mo.rend).toFixed(4)):0;
    apu.mo.push({moId:mo.cod,desc:mo.desc,und:mo.und,cant:dias,pu_mo:mo.pu,rend:mo.rend,workers:mo.workers});
    sel.value='';
  }
  calcAPU(apu);autoSave();renderAPUEditor(id);
}

function removeAPUMO(id,idx){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  apu.mo.splice(idx,1);
  calcAPU(apu);autoSave();renderAPUEditor(id);
}

function updateAPUMOField(id,idx,field,value){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu||!apu.mo[idx])return;
  apu.mo[idx][field]=value;
  if(field==='jornal'){
    const j=JORNALES[value];
    if(j) apu.mo[idx].pu_mo=j.pu*(apu.mo[idx].cant||0);
  }
  calcAPU(apu);autoSave();
  const res=$(`apu-resumen-${id}`);
  if(res)res.innerHTML=renderAPUSummary(apu);
}

function recalcAPUDisplay(id){
  const apu=ST.apus.find(a=>a.id===id);
  if(!apu)return;
  calcAPU(apu);autoSave();
  const res=$(`apu-resumen-${id}`);
  if(res)res.innerHTML=renderAPUSummary(apu);
}

(function init(){
  $('cur-date').textContent=new Date().toLocaleDateString('es-DO',{day:'2-digit',month:'2-digit',year:'numeric'});
  const restored=autoLoad();
  buildSidebar();
  nav('dashboard');
  if(restored&&ST.project.nombre){
    setTimeout(()=>notify(`✓ Proyecto restaurado: "${ST.project.nombre}"`, 'ok'),400);
  }
})();
</script>
